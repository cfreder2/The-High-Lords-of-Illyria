name: Deploy playable build

# Every push to master builds the browser version and publishes it to GitHub
# Pages. The version shown in the game is VERSION + this workflow's run number,
# so it goes up by one with every deploy.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:3.1.74
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: version
        run: echo "version=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DILLYRIA_VERSION=${{ steps.version.outputs.version }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stamp build info
        run: |
          printf '{"version":"%s","commit":"%s","built":"%s"}\n' \
            "${{ steps.version.outputs.version }}" "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > build/site/version.json
          ls -la build/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Films the deployed build and adds it to the devlog branch (screenshots and
  # a fly-through video), so the game's history can be replayed later.
  devlog:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Capture
        run: |
          python3 -m http.server 8080 -d site > /dev/null 2>&1 &
          sleep 2
          node tools/devlog/capture.js http://localhost:8080/ "capture"
      - name: Commit to the devlog branch
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin devlog
          git worktree add -B devlog devlog-wt origin/devlog
          dest="devlog-wt/builds/v${VERSION}"
          mkdir -p "$dest"
          cp capture/* "$dest/"
          subject="$(printf '%s' "$COMMIT_SUBJECT" | head -n 1)"
          {
            printf '\n### %s · v%s (`%s`)\n' "$(date -u +'%d %b %Y')" "$VERSION" "${GITHUB_SHA::7}"
            printf '%s\n\n' "$subject"
            printf '| Battle | God view | Phone |\n|---|---|---|\n'
            printf '| ![](builds/v%s/04-battle.png) | ![](builds/v%s/02-god-view.png) | ![](builds/v%s/07-phone.png) |\n\n' "$VERSION" "$VERSION" "$VERSION"
            printf 'Fly-through: [`builds/v%s/flythrough.webm`](builds/v%s/flythrough.webm)\n' "$VERSION" "$VERSION"
          } >> devlog-wt/README.md
          cd devlog-wt
          git add -A
          git commit -m "Devlog: v${VERSION}" -m "Filmed by CI from ${GITHUB_SHA}."
          git push origin devlog
