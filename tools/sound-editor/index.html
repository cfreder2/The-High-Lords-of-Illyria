<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Sound Editor: The High Lords of Illyria</title>
<link rel="stylesheet" href="../audit/audit.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div class="bar" id="topbar">
  <nav><a href="../audit/index.html">Audit</a><a href="../audit/sprites.html">Sprites</a><a href="index.html" class="here">Sound Editor</a><a href="../audit/sounds.html">Inspect</a><a href="effects.html">Effects</a><a href="voices.html">Voices</a></nav>
  
</div>
<main id="page"></main>
<script src="../audit/sound-core.js"></script>
<script src="../audit/sound-ui.js"></script>
<script src="dsp.js"></script>
<script src="common.js"></script>
<script>
(async () => {
  "use strict";
  window.AUDIT_BASE = "../audit/";
  const A = window.AuditSound, SE = window.SoundEditor, el = SE.el, page = document.getElementById("page");
  await SE.ready;
  let ok = true;
  try { await A.load(); } catch (e) { ok = false; }
  const card = (href, title, text) => el("a", { class: "card", href }, el("h3", {}, title), el("p", {}, text));
  let fx = null, vo = null;
  if (SE.server) { try { fx = await SE.get("/api/effects"); vo = await SE.get("/api/voices"); } catch (e) { /* shown by the banner */ } }
  const lines = ok && A.lines ? A.lines.sets.reduce((n, s) => n + s.situations.reduce((j, x) => j + x.lines.length, 0), 0) : 0;
  const ncand = fx ? Object.values(fx.events).reduce((n, e) => n + e.cands.length, 0) : 0, ntakes = fx ? Object.values(fx.own).reduce((n, l) => n + l.length, 0) : 0;
  const changed = fx ? fx.sounds.filter((s) => s.chosen.some((x, i) => x !== "game:" + (i + 1)) || s.chosen.length !== s.originals).length : 0;
  page.append(el("p", { class: "note", style: "margin-top:16px" }, "One place for the game's sound: inspect what is there, audition candidates, record your own, choose. Choosing puts the sound in the game's working tree at once; you commit when you are content."),
    SE.banner(),
    el("div", { class: "hub" },
      card("../audit/sounds.html", "Inspect", ok ? `${A.manifest.sounds.length} sounds in ${A.manifest.sounds.reduce((n, s) => n + s.files.length, 0)} files: what asks for each, its waveform and faults, as the game plays it; the mix under load; the silent events.` : "The game's sounds, measured and played as the game plays them."),
      card("effects.html", "Effects", fx ? `${ncand} candidates and ${ntakes} of your takes in the workspace; ${changed} sounds changed from git. Tick variants, trim and level them, record.` : "Each sound's variants, candidates and your takes: choose, edit, record."),
      card("voices.html", "Voices", ok && A.lines ? `${A.lines.sets.length} voice sets, ${lines} lines, ${A.available.size} in the game${vo ? `, ${Object.values(vo.own).reduce((n, l) => n + l.length, 0)} takes in the workspace` : ""}. A studio for recording them one after another.` : "Every voice line, with a recording studio."),
      card("effects.html#changes", "Installed changes", "What differs from git, with undo."),
      card("README.md", "How to use it", "Start it, record, pick, check in the game, commit.")));
})();
</script>
</body>
</html>
